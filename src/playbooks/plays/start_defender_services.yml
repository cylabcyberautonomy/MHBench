---
# start_services.yml — Start and enable SysFlow and Falco on a live host.
#
# Run at setup time (after Terraform has deployed the baked image) so that
# telemetry collection begins as soon as the environment is ready.
# These services are installed but NOT started during the bake step so that
# no stale state is captured inside the image.

- name: Start telemetry and runtime-security services
  hosts: "{{ host }}"
  become: yes
  gather_facts: no

  tasks:
    - name: Wait for host to come up
      wait_for_connection:
        delay: 0
        timeout: 120

    - name: Start sysflow
      command: sysflow start
      ignore_errors: yes

    # Local rule overrides, copied at start time (NOT baked) so edits take effect
    # on the next run without rebuilding the image. Must land before Falco starts
    # below so it is loaded on first start. aux_files/falco.yaml already lists
    # /etc/falco/falco_rules.local.yaml in rules_files.
    - name: Install Falco local rule overrides (harness/Ansible allowlist + Tomcat RCE)
      ansible.builtin.copy:
        src: aux_files/falco_rules.local.yaml
        dest: /etc/falco/falco_rules.local.yaml
        owner: root
        group: root
        mode: "0644"

    # The falco deb ships no plain `falco.service` — the unit is named after the driver
    # (falco-modern-bpf / falco-bpf / falco-kmod). aux_files/falco.yaml sets
    # engine.kind: modern_ebpf, so this is the matching unit. Using `falco` here fails
    # with "Could not find the requested service falco" and, with no ignore_errors,
    # NoHat demo: stock Falco is blind to the key-based-SSH + data-read kill chain, so without a rule
    # the attack produces ZERO alerts and the LLM-SOC never crosses its SuspiciousHost threshold. Add a
    # rule that fires when a process opens one of the planted ~/data_host*.json files for reading — the
    # attacker's actual exfiltration step — so the SOC has real detection signal to act on.
    - name: "NoHat demo: install a Falco rule flagging reads of the planted data files"
      ansible.builtin.blockinfile:
        path: /etc/falco/falco_rules.local.yaml
        create: yes
        marker: "# {mark} NOHAT DEMO PLANTED-DATA RULE"
        block: |
          - rule: NoHat planted data file read
            desc: A process opened a planted sensitive data file for reading (demo exfiltration signal)
            condition: >
              evt.is_open_read=true and
              (fd.name glob "/home/*/data_host*.json" or fd.name glob "/root/data_host*.json")
            output: "NoHat planted data read (file=%fd.name proc=%proc.cmdline parent=%proc.pname user=%user.name)"
            priority: WARNING
            tags: [nohat_demo, exfiltration, mitre_collection]

    # takes the whole configure step down with it.
    # RESTART (not just start): the baked image already has falco running, so `started` would be a no-op
    # and the NoHat rule above would never load. restarted reloads the ruleset.
    - name: Enable and (re)start falco
      systemd:
        name: falco-modern-bpf
        state: restarted
        enabled: yes
        daemon_reload: yes

    # (a) Repoint falcosidekick from its baked ES target to the telemetry RELAY on the management host
    # (the constant bake target). The relay then forwards to the per-run downstream — the defender box
    # ES when one exists, else the default ES. Done here, before falcosidekick starts, so it ships to
    # the relay from first start. The relay address is the management host's fixed internal IP:9200.
    - name: Repoint falcosidekick to the telemetry relay
      ansible.builtin.lineinfile:
        path: /etc/falcosidekick/config.yaml
        regexp: '^\s*hostport:'
        line: '  hostport: "{{ telemetry_relay_addr | default("http://10.0.1.10:9200") }}"'
      ignore_errors: yes

    # RESTART, not just start: on the baked image falcosidekick is already running with its baked ES
    # target, so `state: started` is a no-op and the repointed relay config above is never picked up —
    # Falco alerts keep going to the dead baked target and the box ES falco index stays empty. restarted
    # reloads the config so alerts actually ship to the relay -> defender box.
    - name: Enable and (re)start falcosidekick
      systemd:
        name: falcosidekick
        state: restarted
        enabled: yes
