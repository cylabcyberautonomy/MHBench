---
- name: Install Zeek (no start)
  hosts: "{{ host }}"
  become: yes

  tasks:
    - name: Ensure prerequisites
      apt:
        name:
          - curl
          - gnupg
          - software-properties-common
          - cmake
          - make
          - gcc
          - g++
          - flex
          - bison
          - libpcap-dev
          - libssl-dev
          - python3
          - python3-dev
          - swig
          - zlib1g-dev
        state: present
        update_cache: yes

    - name: Add Zeek GPG key
      shell: |
        curl -fsSL https://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/Release.key | \
        gpg --dearmor -o /usr/share/keyrings/zeek-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/zeek-archive-keyring.gpg

    - name: Add Zeek apt repository
      shell: |
        echo "deb [signed-by=/usr/share/keyrings/zeek-archive-keyring.gpg] https://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/ /" | \
        tee /etc/apt/sources.list.d/zeek.list
      args:
        creates: /etc/apt/sources.list.d/zeek.list

    - name: Install Zeek
      apt:
        name: zeek
        state: present
        update_cache: yes

    - name: Add Zeek to PATH
      lineinfile:
        path: /etc/environment
        regexp: '^PATH='
        line: 'PATH="/usr/local/zeek/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"'

    - name: Ensure Zeek does not start on boot
      systemd:
        name: zeek
        enabled: no
        state: stopped
      ignore_errors: yes
