#
# Linux Audit Daemon - /etc/audit/auditd.conf
# Vendored for DISSECT / MHBench attack-agent telemetry.
#
# DISSECT changes are marked  ## >>> CHANGED.  Everything else is the Ubuntu stock value.
#
# Rationale, in one line: the stock config is tuned for a production estate where disk is scarce and
# old records stop mattering. Here a missing record is a false research finding, so nothing may be
# deleted or silently suspended for the length of one experiment.
#
# What the stock defaults cost us, measured on sonnet_enterprise_b/database0: an nmap sweep run from
# that host wrote 32 MB (~148k records) in 19 SECONDS - 1.7 MB/s - filling and rotating the 8 MB log
# four times over. With num_logs=5 that evicted every file written before the burst, so the earliest
# surviving record was 58 MINUTES into the run, erasing the SSH login that compromised the host. It
# was only recoverable from auth.log, which auditd does not manage. Three hosts hit this in that one
# cell (database0, employeea0, employeeb0) - precisely the three the attacker used most heavily.
#
# NOTE (still unfixed by this file): the KERNEL drops records before auditd ever sees them once its
# backlog is full. The same run lost 10,622 that way (`audit_backlog_limit=32768` exceeded). That is a
# `-b` / `--backlog_wait_time` change in audit.rules, not here.
#
# NOTE (disk): with keep_logs nothing is ever deleted, so a run is bounded only by the volume. On the
# m1.small flavor (20 GB) that is not close: the heaviest host with complete coverage in
# sonnet_enterprise_b (employeea0) wrote 33 MB over an 80-minute run - 0.2% of the disk - and the
# whole 41-host cell came to 222 MB. Filling 20 GB needs ~3.4 hours at the sustained 1.7 MB/s burst
# rate. At 64 MB per file a typical heavy host now writes ONE file and never rotates, which removes
# the risky moment entirely. Nothing accumulates between runs: rotate_host_logs.yml still deletes
# audit.log.* before each attack (SIGUSR1 forces that rotation; keep_logs only stops auditd deleting
# on its own), and the VMs are torn down after.

local_events = yes
write_logs = yes
log_file = /var/log/audit/audit.log
log_group = adm
log_format = ENRICHED
flush = INCREMENTAL_ASYNC
freq = 50

## >>> CHANGED: 8 -> 64. Fewer, larger files. Rotation is the moment records are at risk, so rotate
## an order of magnitude less often; with keep_logs this only changes file granularity, not retention.
max_log_file = 64

## >>> CHANGED: ROTATE -> KEEP_LOGS. THE POINT OF THIS FILE. keep_logs rotates but never deletes and
## ignores num_logs entirely, so suffixes just keep incrementing. Under ROTATE, auditd deletes the
## oldest file once num_logs is reached - which is how a compromise vanished from database0.
max_log_file_action = KEEP_LOGS

## >>> CHANGED: 5 -> 999. Ignored under keep_logs; set high so that if anyone ever reverts the action
## above to ROTATE, the failure is bounded rather than immediate.
num_logs = 999

priority_boost = 4
name_format = NONE

## >>> CHANGED: q_depth 1200 -> 16384. The in-daemon queue between the kernel netlink socket and the
## disk writer. A burst that outruns the writer overflows this queue and is lost inside auditd, which
## no retention setting can recover.

## Two thresholds, deliberately different actions. Warn early while there is still room to act on the
## warning; stop cleanly before the disk is actually full.
space_left = 512
space_left_action = SYSLOG
verify_email = yes
action_mail_acct = root
admin_space_left = 128

## >>> CHANGED: stock SUSPEND is kept here, and disk_full/disk_error are moved TO it. Stopping is the
## right end state, not a compromise: at the 1.7 MB/s burst rate measured above, 128 MB of headroom is
## ~75 seconds, so "warn and keep writing" does not buy a usable warning - it just runs the disk to
## zero. A suspended log ends at a known instant with every record before it intact and the host still
## up; a full disk gives a truncated tail, no room to even write the syslog note, and possibly a dead
## VM. A clean stop is also DETECTABLE downstream (the log simply ends), which a corrupt tail is not.
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SUSPEND

use_libwrap = yes
tcp_listen_queue = 5
tcp_max_per_addr = 1
tcp_client_max_idle = 0
krb5_principal = auditd
distribute_network = no
