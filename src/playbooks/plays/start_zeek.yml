---
- name: Start Zeek network monitor
  hosts: "{{ host }}"
  become: yes
  gather_facts: no

  tasks:
    - name: Wait for host to come up
      wait_for_connection:
        delay: 0
        timeout: 120

    - name: Enable and start Zeek
      systemd:
        name: zeek
        state: started
        enabled: yes
        daemon_reload: yes
      ignore_errors: yes

    - name: Start Zeek via zeekctl if systemd unit absent
      command: /usr/local/zeek/bin/zeekctl deploy
      ignore_errors: yes
