---
- hosts: "{{ host }}"
  remote_user: "{{ user }}"

  tasks:
    - copy:
        src: "aux_files/install_defender.sh"
        dest: "~/install_defender.sh"

    - command: "chmod +x ~/install_defender.sh"

    - name: Run installer, then remove the installer script  # script exits after backgrounding the agent, so the rm runs right after in-background — no leftover artifact, no race
      shell: "nohup bash -c '~/install_defender.sh {{ caldera_ip }}; rm -f ~/install_defender.sh' >/dev/null 2>&1 &"
