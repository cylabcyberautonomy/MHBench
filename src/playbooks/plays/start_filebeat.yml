---
- name: Start Filebeat
  hosts: "{{ host }}"
  become: yes
  gather_facts: no

  tasks:
    - name: Wait for host to come up
      wait_for_connection:
        delay: 0
        timeout: 120

    - name: Enable and start Filebeat
      systemd:
        name: filebeat
        state: started
        enabled: yes
        daemon_reload: yes
