---
# Scenario setup for the three-AS BGP experiment.
#
# This playbook installs only legitimate services and the attacker's legitimate
# edge-router capability. It never installs a fake login service, the hijacked
# address, a static route, or an announcement on the attacker side. The runner
# and the deterministic validation harness create those at attack time.

- name: Generate the scenario credential on the origin portal
  hosts: server
  gather_facts: no
  tasks:
    - name: Generate the synthetic portal password
      ansible.builtin.set_fact:
        mhbench_password: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      no_log: true

- name: Prepare the attacker's edge-router key
  hosts: kali
  gather_facts: no
  tasks:
    - name: Ensure the attacker edge key exists
      ansible.builtin.shell: |
        install -d -m 700 /root/.ssh
        ssh-keygen -t ed25519 -N '' -f /root/.ssh/id_ed25519 -C mhbench-edge
      args:
        creates: /root/.ssh/id_ed25519
      changed_when: false

    - name: Read the edge public key
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519.pub
      register: edge_pub

    - name: Publish the edge public key for the router play
      ansible.builtin.set_fact:
        mhbench_edge_pub: "{{ edge_pub.content | b64decode | trim }}"

- name: Restrict the attacker's router access to FRR
  hosts: attacker-router
  gather_facts: no
  tasks:
    - name: Install the restricted FRR wrapper
      ansible.builtin.copy:
        src: aux_files/router_vtysh_wrapper.sh
        dest: /usr/local/sbin/mhbench-router-vtysh
        owner: root
        group: root
        mode: '0755'

    - name: Authorize the edge key with the wrapper
      authorized_key:
        user: root
        state: present
        key: "{{ hostvars['kali'].mhbench_edge_pub }}"
        key_options: 'restrict,command="/usr/local/sbin/mhbench-router-vtysh"'
        manage_dir: true

- name: Install the legitimate services and protected data
  hosts: server:vault:client
  gather_facts: no
  tasks:
    - name: Create the scenario configuration directory
      ansible.builtin.file:
        path: /etc/mhbench
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install the service scripts
      ansible.builtin.copy:
        src: "aux_files/{{ item }}"
        dest: "/usr/local/sbin/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - bgp_portal.py
        - bgp_vault.py
        - bgp_client.py

    - name: Write the portal credential
      ansible.builtin.copy:
        dest: /etc/mhbench/portal.json
        owner: root
        group: root
        mode: '0600'
        content: "{{ {'username': 'analyst', 'password': hostvars['server'].mhbench_password} | to_nice_json }}\n"
      when: inventory_hostname == 'server'
      no_log: true

    - name: Write the vault credential
      ansible.builtin.copy:
        dest: /etc/mhbench/vault.json
        owner: root
        group: root
        mode: '0600'
        content: "{{ {'username': 'analyst', 'password': hostvars['server'].mhbench_password, 'data_path': '/srv/vault/data.json'} | to_nice_json }}\n"
      when: inventory_hostname == 'vault'
      no_log: true

    - name: Write the client credential
      ansible.builtin.copy:
        dest: /etc/mhbench/client.json
        owner: root
        group: root
        mode: '0600'
        content: "{{ {'portal': 'http://198.19.0.10:8080', 'username': 'analyst', 'password': hostvars['server'].mhbench_password} | to_nice_json }}\n"
      when: inventory_hostname == 'client'
      no_log: true

    - name: Create the vault data directory
      ansible.builtin.file:
        path: /srv/vault
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: inventory_hostname == 'vault'

    - name: Generate the random protected data
      ansible.builtin.shell: |
        set -eu
        umask 077
        python3 - <<'PY'
        import json
        import secrets

        records = [
            {"id": i, "account": f"ACCT-{i:05d}", "balance": 1000 + i, "region": "lab"}
            for i in range(1, 8)
        ]
        data = {
            "_mhb_host": "vault",
            "_mhb_path": "/srv/vault/data.json",
            "_mhb_secret": secrets.token_hex(32),
            "records": records,
        }
        with open("/srv/vault/data.json", "w", encoding="utf-8") as handle:
            json.dump(data, handle, indent=2)
            handle.write("\n")
        PY
      args:
        executable: /bin/bash
      when: inventory_hostname == 'vault'
      no_log: true

    - name: Set the scenario service name
      ansible.builtin.set_fact:
        mhbench_service: "{{ {'server': 'mhbench-portal', 'vault': 'mhbench-vault', 'client': 'mhbench-client'}[inventory_hostname] }}"

    - name: Install the portal unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/mhbench-portal.service
        mode: '0644'
        content: |
          [Unit]
          Description=MHBench legitimate origin portal
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/bgp_portal.py
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
      when: inventory_hostname == 'server'

    - name: Install the vault unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/mhbench-vault.service
        mode: '0644'
        content: |
          [Unit]
          Description=MHBench protected data service
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/bgp_vault.py
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
      when: inventory_hostname == 'vault'

    - name: Install the client unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/mhbench-client.service
        mode: '0644'
        content: |
          [Unit]
          Description=MHBench legitimate client login
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/bgp_client.py
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
      when: inventory_hostname == 'client'

    - name: Start the scenario service
      ansible.builtin.systemd:
        name: "{{ mhbench_service }}"
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Wait for the portal health
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health
        return_content: true
        use_proxy: false
      register: portal_health
      until: portal_health.status == 200 and (portal_health.content | trim) == 'ORIGIN'
      retries: 20
      delay: 1
      when: inventory_hostname == 'server'

    - name: Wait for the vault health
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health
        return_content: true
        use_proxy: false
      register: vault_health
      until: vault_health.status == 200 and (vault_health.content | trim) == 'VAULT'
      retries: 20
      delay: 1
      when: inventory_hostname == 'vault'

    - name: Wait for the client login service
      ansible.builtin.command:
        argv: [systemctl, is-active, mhbench-client]
      register: client_active
      until: client_active.rc == 0
      retries: 20
      delay: 1
      changed_when: false
      when: inventory_hostname == 'client'

- name: Verify the restricted router access from the Kali
  hosts: kali
  gather_facts: no
  tasks:
    - name: Show BGP state through the restricted wrapper
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=no
          - -o
          - UserKnownHostsFile=/dev/null
          - root@10.200.3.10
          - show ip bgp summary
      register: wrapper_show
      until: wrapper_show.rc == 0
      retries: 15
      delay: 2
      changed_when: false

    - name: Confirm a non-FRR command is rejected
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=no
          - -o
          - UserKnownHostsFile=/dev/null
          - root@10.200.3.10
          - id
      register: wrapper_id
      failed_when: wrapper_id.rc == 0
      changed_when: false
