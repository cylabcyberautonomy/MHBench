---
# One leader ({{ host }}) → all its followers, done in a SINGLE ansible run instead of one run per follower.
# Accepts the new per-leader shape (followers: [{follower, follower_user}, ...]) OR the legacy single pair
# (follower/follower_user), so it's safe during a rolling migration. The leader's whole ~/.ssh/config is
# written in ONE blockinfile task (the block is Jinja-templated over every follower) — NOT a 48-iteration
# loop, which cost one SSH round-trip per follower (~1 min each through the contended bastion) and made
# large-env (star) config ~= host count in minutes. gather_facts is off: nothing here uses ansible_facts
# (ansible_host comes from inventory), so we skip the per-host setup-module round-trip.
- hosts: "{{ host }}"
  gather_facts: false
  vars:
    _followers: "{{ followers | default([{'follower': follower, 'follower_user': follower_user}]) }}"
  tasks:
    - name: Ensure leader .ssh dir
      become: true
      become_user: "{{ host_user }}"
      file: { path: ~/.ssh, state: directory, mode: "0700" }

    - name: Generate leader SSH key if absent
      become: true
      become_user: "{{ host_user }}"
      shell: { cmd: 'ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -q -N ""', creates: ~/.ssh/id_ed25519 }

    - name: Read leader public key
      become: true
      become_user: "{{ host_user }}"
      ansible.builtin.slurp: { src: ~/.ssh/id_ed25519.pub }
      register: leader_pub

    - name: Publish leader pubkey as a fact
      set_fact:
        public_key: "{{ leader_pub.content | b64decode }}"

    - name: Write every follower into the leader's ~/.ssh/config in ONE task
      become: true
      become_user: "{{ host_user }}"
      blockinfile:
        path: ~/.ssh/config
        create: true
        mode: "0600"
        marker: "# {mark} phdpt-followers"
        block: |
          {% for f in _followers %}
          Host {{ f.follower }}_{{ f.follower_user }}
            HostName {{ hostvars[f.follower]['ansible_host'] }}
            User {{ f.follower_user }}
            IdentityFile ~/.ssh/id_ed25519
          {% endfor %}

- hosts: "{{ (followers | default([{'follower': follower, 'follower_user': follower_user}])) | map(attribute='follower') | join(',') }}"
  gather_facts: false
  vars:
    _followers: "{{ followers | default([{'follower': follower, 'follower_user': follower_user}]) }}"
  tasks:
    - name: Add leader pubkey to this follower's authorized_keys
      authorized_key:
        user: "{{ (_followers | selectattr('follower', 'equalto', inventory_hostname) | first).follower_user }}"
        key: "{{ hostvars[host]['public_key'] }}"
